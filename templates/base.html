<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}JobBridge{% endblock %}</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; color: #1f2937; background: #f5f6f8; }
        header { background: #fff; border-bottom: 1px solid #ddd; }
        nav, main { max-width: 960px; margin: auto; padding: 20px; }
        nav { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
        nav strong { margin-right: auto; }
        nav form { margin: 0; }
        a { color: #1d4ed8; }
        main { margin-top: 24px; }
        section { padding: 24px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 10px 16px; border: 0; border-radius: 4px; background: #1d4ed8; color: #fff; font: inherit; cursor: pointer; }
        input:not([type="hidden"]), select, textarea { box-sizing: border-box; max-width: 100%; padding: 10px; border: 1px solid #aaa; border-radius: 4px; font: inherit; }
        label { display: block; margin-bottom: 6px; }
        .errorlist { color: #b91c1c; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Điều hướng chính">
            <strong>JobBridge</strong>
            {% if user.is_authenticated %}
                <a href="{% url 'recruitment_web:job-list' %}">Tin tuyển dụng</a>
                <a href="{% url 'accounts_web:profile' %}">Tài khoản của tôi</a>
                <form method="post" action="{% url 'accounts_web:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Đăng xuất</button>
                </form>
            {% else %}
                <a href="{% url 'accounts_web:login' %}">Đăng nhập</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}
            <div role="status">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
