{% extends "base.html" %}

{% block title %}Ứng viên | JobBridge{% endblock %}

{% block content %}
    <section>
        <h1>Ứng viên</h1>
        <table>
            <thead><tr><th>Họ tên</th><th>Điện thoại</th><th>Email</th></tr></thead>
            <tbody>
                {% for candidate in candidates %}
                    <tr>
                        <td><a href="{% url 'recruitment_web:candidate-detail' candidate.pk %}">{{ candidate.full_name }}</a></td>
                        <td>{{ candidate.phone }}</td><td>{{ candidate.email }}</td>
                    </tr>
                {% empty %}
                    <tr><td colspan="3">Chưa có ứng viên.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </section>
{% endblock %}
