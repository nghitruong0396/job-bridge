{% extends "base.html" %}

{% block title %}Đăng nhập | JobBridge{% endblock %}

{% block content %}
    <div class="auth-panel">
        <div class="text-center mb-4">
            <h1 class="page-title">Đăng nhập</h1>
        </div>
        <section class="card">
            <div class="card-body">
                <form method="post" action="{% url 'accounts_web:login' %}">
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                    <button class="btn btn-primary w-100 mt-2" type="submit">Đăng nhập</button>
                </form>
            </div>
        </section>
    </div>
{% endblock %}
